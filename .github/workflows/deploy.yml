name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Locate static build output
        id: output
        run: |
          for dir in dist/client .output/public dist; do
            if [ -f "$dir/index.html" ]; then
              echo "path=$dir" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No static build output (index.html) found in dist/client, .output/public or dist" >&2
          ls -R dist .output 2>/dev/null || true
          exit 1
      - name: Ensure .nojekyll exists
        run: touch "${{ steps.output.outputs.path }}/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
